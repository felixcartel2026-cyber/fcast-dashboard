    data_file = os.path.join(script_dir, 'data.json')
    
    with open(data_file, 'w') as f:
        json.dump(data, f, indent=2)
    
    print(f"✅ Data updated at {datetime.now().strftime('%Y-%m-%d %I:%M:%S %p')}")

