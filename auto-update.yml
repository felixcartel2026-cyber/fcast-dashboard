#!/usr/bin/env python3
"""
FCAST Dashboard Data Updater
Updates data.json with live information from the system
Run this every 5 minutes via cron
"""

import json
import os
import subprocess
from datetime import datetime, timedelta

def get_gateway_status():
    """Check if OpenClaw Gateway is running"""
    try:
        result = subprocess.run(
            ['openclaw', 'gateway', 'status'],
            capture_output=True,
            text=True,
            timeout=10
        )
        if 'RPC probe: ok' in result.stdout:
            return 'online', '60+ hours'  # Simplified
        return 'offline', '0 hours'
    except:
        return 'offline', '0 hours'

def get_current_hour():
    """Get current hour in EST"""
    now = datetime.now()
    return now.hour

def get_day_progress():
    """Calculate day progress percentage"""
    now = datetime.now()
    seconds_in_day = now.hour * 3600 + now.minute * 60 + now.second
    progress = (seconds_in_day / 86400) * 100
    return round(progress, 1)

def get_time_until_reset():
    """Calculate time until midnight"""
    now = datetime.now()
    midnight = datetime(now.year, now.month, now.day) + timedelta(days=1)
    diff = midnight - now
    hours = diff.seconds // 3600
    minutes = (diff.seconds % 3600) // 60
    return f"{hours}h {minutes}m"

def get_recent_activity():
    """Read recent activity from memory files"""
    activities = []
    
    # Check if memory file exists
    memory_file = os.path.expanduser('~/.openclaw/workspace/memory/2026-04-29.md')
    if os.path.exists(memory_file):
        activities.append({
            "time": datetime.now().strftime("%I:%M %p"),
            "agent": "System",
            "action": "Memory updated"
        })
    
    # Default activities if no memory file
    if not activities:
        activities = [
            {"time": "03:15 AM", "agent": "Felix", "action": "Dashboard enhancement"},
            {"time": "01:09 AM", "agent": "Felix", "action": "System maintenance"},
            {"time": "00:52 AM", "agent": "Felix", "action": "GitHub Pages deployment"},
            {"time": "00:47 AM", "agent": "Felix", "action": "Repository created"},
            {"time": "00:42 AM", "agent": "Simon", "action": "GitHub account setup"}
        ]
    
    return activities

def main():
    """Main function to update data.json"""
    
    gateway_status, uptime = get_gateway_status()
    current_hour = get_current_hour()
    day_progress = get_day_progress()
    time_until_reset = get_time_until_reset()
    recent_activity = get_recent_activity()
    
    data = {
        "lastUpdated": datetime.now().isoformat() + "Z",
        "agents": [
            {
                "name": "Felix",
                "emoji": "🐾",
                "role": "Coordinator & General Assistant",
                "status": "online",
                "lastSeen": "Active now",
                "currentTask": "Dashboard enhancement"
            },
            {
                "name": "Hermes",
                "emoji": "⚡",
                "role": "Coding Specialist",
