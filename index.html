<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAST - AI Agent Team Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff; min-height: 100vh; padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-size: 3rem; margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .tagline { color: #a0a0a0; font-size: 1.2rem; }
        .last-updated { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
        .timekeeper {
            background: rgba(255,255,255,0.05); border-radius: 16px;
            padding: 1.5rem; margin-bottom: 2rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .timekeeper h2 { color: #e94560; margin-bottom: 1rem; font-size: 1.3rem; }
        .time-display {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 1rem;
        }
        .time-box { text-align: center; }
        .time-box .label { color: #a0a0a0; font-size: 0.85rem; }
        .time-box .value { font-size: 1.5rem; font-weight: 600; }
        .progress-bar {
            flex: 1; min-width: 200px; height: 20px;
            background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.5s ease;
        }
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem; margin-bottom: 2rem;
        }
        .card {
            background: rgba(255,255,255,0.05); border-radius: 16px;
            padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .card h2 { color: #e94560; margin-bottom: 1rem; font-size: 1.3rem; }
        .agent-list { display: flex; flex-direction: column; gap: 1rem; }
        .agent-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 12px;
        }
        .agent-emoji { font-size: 2rem; }
        .agent-info { flex: 1; }
        .agent-name { font-weight: 600; font-size: 1.1rem; }
        .agent-role { color: #a0a0a0; font-size: 0.9rem; }
        .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00d26a; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .system-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .system-item { padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 8px; text-align: center; }
        .system-item .label { color: #a0a0a0; font-size: 0.85rem; }
        .system-item .value { font-size: 1.2rem; font-weight: 600; margin-top: 0.25rem; color: #00d26a; }
        footer { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 FCAST</h1>
            <p class="tagline">AI Agent Team Dashboard</p>
            <p class="last-updated">Last updated: <span id="lastUpdated">Loading...</span></p>
        </header>
        
        <div class="timekeeper">
            <h2>⏰ TimeKeeper</h2>
            <div class="time-display">
                <div class="time-box">
                    <div class="label">Current Time</div>
                    <div class="value" id="currentTime">--:--</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="dayProgress" style="width: 0%"></div>
                </div>
                <div class="time-box">
                    <div class="label">Day Progress</div>
                    <div class="value" id="dayProgressText">0%</div>
                </div>
            </div>
        </div>
        
        <div class="dashboard-grid">
            <div class="card">
                <h2>🤖 Active Agents</h2>
                <div class="agent-list" id="agentList">Loading...</div>
            </div>
            
            <div class="card">
                <h2>💓 System Health</h2>
                <div class="system-grid" id="systemGrid">Loading...</div>
            </div>
        </div>
        
        <footer>
            <p>© 2026 FCAST Team | Built with AI</p>
            <p style="font-size: 0.85rem; margin-top: 0.5rem;">Auto-refreshing every 5 minutes</p>
        </footer>
    </div>
    
    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                
                document.getElementById('lastUpdated').textContent = new Date(data.lastUpdated).toLocaleString();
                document.getElementById('currentTime').textContent = data.timekeeper.currentTime;
                document.getElementById('dayProgress').style.width = data.timekeeper.dayProgress + '%';
                document.getElementById('dayProgressText').textContent = data.timekeeper.dayProgress + '%';
                
                document.getElementById('agentList').innerHTML = data.agents.map(agent => `
                    <div class="agent-item">
                        <div class="agent-emoji">${agent.emoji}</div>
                        <div class="agent-info">
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-role">${agent.role}</div>
                        </div>
                        <div class="status">
                            <span class="status-dot"></span>
                            ${agent.status}
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('systemGrid').innerHTML = `
                    <div class="system-item">
                        <div class="label">Gateway</div>
                        <div class="value">${data.system.gatewayStatus}</div>
                    </div>
                    <div class="system-item">
                        <div class="label">Uptime</div>
                        <div class="value">${data.system.gatewayUptime}</div>
                    </div>
                    <div class="system-item">
                        <div class="label">Telegram</div>
                        <div class="value">${data.system.telegramStatus}</div>
                    </div>
                    <div class="system-item">
                        <div class="label">Discord</div>
                        <div class="value">${data.system.discordStatus}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
