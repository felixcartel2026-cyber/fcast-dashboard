                "currentTask": "Rest/standby"
            },
            {
                "name": "Pi",
                "emoji": "🥧",
                "role": "System Monitor",
                "status": "online",
                "lastSeen": "Active now",
                "currentTask": "Night monitoring"
            }
        ],
        "system": {
            "gatewayStatus": gateway_status,
            "gatewayUptime": uptime,
            "lastHeartbeat": datetime.now().strftime("%Y-%m-%d %I:%M %p"),
            "telegramStatus": "connected",
            "discordStatus": "connected"
        },
        "timekeeper": {
            "currentHour": current_hour,
            "dayProgress": day_progress,
            "currentTime": datetime.now().strftime("%I:%M %p"),
            "timeUntilReset": time_until_reset
        },
        "recentActivity": recent_activity,
        "projects": [
            {
                "name": "Pick it oot!",
